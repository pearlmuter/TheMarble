name: Earth production health

on:
  # A slow backstop only. GitHub drops most scheduled runs -- a '7,37' cron
  # managed about five runs a day out of forty-eight -- so the real trigger is
  # the Cloudflare Worker in infrastructure/publisher-scheduler, which dispatches
  # this workflow on the half hour. This hourly cron keeps the monitor alive if
  # that Worker is ever removed.
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earth-production-health
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Three views, each allowed to outwait the app's 300s activation deadline.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache/restore@v4
        with:
          path: artifacts/production-health/soak.ndjson
          key: ${{ runner.os }}-earth-soak-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-earth-soak-
      - name: Build monitored client
        env:
          VITE_EARTH_STATE_LATEST_URL: ${{ vars.THEMARBLE_CDN_LATEST_URL }}
        run: npm run build
      - name: Start monitored client
        run: npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/themarble-preview.log 2>&1 &
      - name: Wait for monitored client
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Capture fixed production views
        id: smoke
        continue-on-error: true
        run: npm run smoke:production -- --app-url http://127.0.0.1:4173/ --output artifacts/production-health/visual-smoke
      - name: Verify the served feed and its degraded behaviour
        id: feed
        continue-on-error: true
        run: >-
          npm run verify:earth-state-feed --
          --origin "${{ vars.THEMARBLE_CDN_ORIGIN }}"
          --client-origins "${{ vars.THEMARBLE_CLIENT_ORIGINS }}"
          --policy config/earth-production-policy.json
          --app-url http://127.0.0.1:4173/
          --report artifacts/production-health/feed-verification.json
      - name: Evaluate production health and provider soak
        id: monitor
        if: always()
        continue-on-error: true
        run: >-
          npm run monitor:production --
          --snapshot "${{ vars.THEMARBLE_HEALTH_SNAPSHOT_URL }}"
          --origin-latest "${{ vars.THEMARBLE_ORIGIN_LATEST_URL }}"
          --cdn-latest "${{ vars.THEMARBLE_CDN_LATEST_URL }}"
          --smoke-report artifacts/production-health/visual-smoke/smoke-report.json
          --policy config/earth-production-policy.json
          --history artifacts/production-health/soak.ndjson
          --output artifacts/production-health/diagnostics
      - name: Persist provider soak history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/production-health/soak.ndjson
          key: ${{ runner.os }}-earth-soak-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain diagnostics and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-production-health-${{ github.run_id }}
          path: artifacts/production-health
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce production health
        if: always()
        run: |
          test "${{ steps.smoke.outcome }}" = success
          test "${{ steps.feed.outcome }}" = success
          test "${{ steps.monitor.outcome }}" = success
