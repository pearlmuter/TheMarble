name: TheMarble site

# The website is the same `dist/` the desktop app embeds, served from the same
# R2 bucket as the feed. Cloudflare Pages cannot host it: the 16K Milky Way is
# 47 MB and Pages refuses any file over 25 MiB. R2 has no such limit, and the
# site and feed sharing one origin means the app reads the feed same-origin.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/themarble-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: themarble-site
  # Uploads must queue, not overlap. Cancelling a run does not recall the writes
  # already in flight, and R2 rejects concurrent writes to the same key.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.THEMARBLE_ORIGIN_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.THEMARBLE_ORIGIN_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.THEMARBLE_ORIGIN_REGION }}
      AWS_ENDPOINT_URL: ${{ vars.THEMARBLE_ORIGIN_ENDPOINT }}
      BUCKET: ${{ vars.THEMARBLE_ORIGIN_BUCKET_URI }}
      # R2 rate-limits repeated writes to one key; back off rather than fail the deploy.
      AWS_RETRY_MODE: adaptive
      AWS_MAX_ATTEMPTS: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the site against the production feed
        env:
          VITE_EARTH_STATE_LATEST_URL: ${{ vars.THEMARBLE_CDN_LATEST_URL }}
          VITE_EARTH_STATE_PRESENTATIONS_URL: ${{ vars.THEMARBLE_CDN_PRESENTATIONS_URL }}
        run: npm run build
      # The preview state is published under artifacts/, never public/, so it
      # cannot reach dist. Fail loudly rather than shipping a local state.
      - name: Refuse to ship a local preview state
        run: |
          if [ -d dist/earth-state-preview ]; then
            echo "dist contains a local preview state; it must not be inside public/." >&2
            exit 1
          fi
          du -sh dist
      - name: Upload the site
        run: |
          set -euo pipefail
          # R2 allows roughly one write per second to a single object, so no key
          # below may be written by more than one of these commands.
          aws configure set default.s3.multipart_threshold 512MB
          aws configure set default.s3.max_concurrent_requests 2

          # Fingerprinted output, cached hard. --size-only because a fresh checkout
          # renews every mtime, which would re-upload all 89 MB on every deploy.
          echo "::group::immutable assets"
          aws s3 sync dist "$BUCKET" --size-only --no-progress \
            --exclude 'index.html' --exclude 'earth-state' --exclude 'earth-state/*' \
            --cache-control 'public, max-age=31536000, immutable'
          echo "::endgroup::"

          # The packaged fallback state is replaceable, so it revalidates. The
          # manifest is held back and copied once below, because --size-only cannot
          # see a content change that leaves its size unchanged.
          echo "::group::packaged fallback state"
          aws s3 sync dist/earth-state "$BUCKET/earth-state" --size-only --no-progress \
            --exclude 'bundled-v1.json' \
            --cache-control 'public, max-age=300, must-revalidate'
          echo "::endgroup::"

          echo "::group::pointers"
          aws s3 cp dist/earth-state/bundled-v1.json "$BUCKET/earth-state/bundled-v1.json" \
            --cache-control 'public, max-age=300, must-revalidate' --content-type application/json
          aws s3 cp dist/index.html "$BUCKET/index.html" \
            --cache-control 'public, max-age=60, must-revalidate' --content-type 'text/html; charset=utf-8'
          echo "::endgroup::"
      - name: Verify the served site
        run: |
          for path in index.html; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${{ vars.THEMARBLE_CDN_ORIGIN }}$path")
            echo "$path -> $code"
            test "$code" = "200"
          done

          # The check above appends the filename, so it has never exercised the address a
          # visitor actually types. R2 serves no index document for a directory request, so the
          # bare origin returns the CDN's 404 page and every first-time visitor sees that
          # instead of the Earth. The repair is a Cloudflare rule rewriting / to /index.html,
          # not anything in this bucket, so this warns rather than failing a deploy it cannot
          # fix. Make it fatal once the origin serves the root.
          root=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${{ vars.THEMARBLE_CDN_ORIGIN }}")
          echo "/ -> $root"
          if [ "$root" != "200" ]; then
            echo "::warning title=Site root does not serve::${{ vars.THEMARBLE_CDN_ORIGIN }} returns $root. Only /index.html serves, so anyone typing the bare address gets the CDN 404 page."
          fi
