<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030711" />
    <title>TheMarble</title>
  </head>
  <body>
    <main id="app" aria-label="Live digital Earth">
      <canvas id="globe" aria-label="Interactive representation of Earth"></canvas>
      <div id="provenance-disclosure" class="provenance-disclosure" data-provenance-open="false">
        <button id="provenance-trigger" class="info-trigger" type="button" aria-label="Earth data details" aria-controls="provenance-panel" aria-expanded="false" aria-describedby="earth-state-summary"></button>
        <section id="provenance-panel" class="hud" role="region" aria-labelledby="provenance-title" aria-hidden="true" hidden>
          <header class="hud-header">
            <p class="eyebrow">ORBITAL VIEW · DATA PROVENANCE</p>
            <h1 id="provenance-title">TheMarble</h1>
            <p id="provenance-state" class="state-label">Loading verified Earth state</p>
          </header>
          <p id="clock" class="clock"></p>
          <p id="sun-status" class="detail"></p>
          <div id="provenance-sections" class="provenance-sections"></div>
        </section>
      </div>
      <p id="earth-state-summary" class="sr-only">TheMarble is loading a verified Earth state.</p>
      <div id="loading" class="loading" role="status" aria-label="Loading Earth"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
