<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030711" />
    <title>TheMarble</title>
  </head>
  <body>
    <main id="app" aria-label="Live digital Earth">
      <canvas id="globe" aria-label="Interactive representation of Earth"></canvas>
      <button class="info-trigger" type="button" aria-label="Show TheMarble details"></button>
      <section class="hud" aria-live="polite">
        <p class="eyebrow">ORBITAL VIEW</p>
        <h1>TheMarble</h1>
        <p id="clock" class="clock"></p>
        <p id="sun-status" class="detail"></p>
      </section>
      <div id="loading" class="loading" role="status" aria-label="Loading Earth"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
