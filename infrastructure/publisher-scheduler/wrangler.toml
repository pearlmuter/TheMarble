name = "themarble-publisher-scheduler"
main = "worker.js"
compatibility_date = "2026-08-01"

# Every ten minutes. Cloudflare honours this; GitHub's own scheduler did not.
# The publisher advances at most once per validated nominal hour, so the extra
# pokes cost one API call each and change nothing.
[triggers]
crons = ["*/10 * * * *"]

[vars]
REPOSITORY = "pearlmuter/TheMarble"
WORKFLOW = "earth-state-clouds.yml"
REF = "main"

# GITHUB_TOKEN is a secret, set with `wrangler secret put GITHUB_TOKEN` or in the
# dashboard. It needs exactly one permission: Actions: read and write, on this
# repository only.
